<!DOCTYPE html>
<html>
<body>
  <script>
    const str = 'áéíóú\tñ';
    const buf = new ArrayBuffer(str.length * 2 + 2);
    const view = new Uint16Array(buf);
    view[0] = 0xFEFF;
    for(let i=0; i<str.length; i++){
      view[i+1] = str.charCodeAt(i);
    }
    const blob = new Blob([view], { type: 'text/csv' });
    
    const reader = new FileReader();
    reader.onload = (e) => {
      console.log('Read text:', e.target.result);
      if(e.target.result === str) {
        document.body.innerHTML = '<h1>SUCCESS</h1>';
      } else {
        document.body.innerHTML = '<h1>FAIL: ' + e.target.result + '</h1>';
      }
    };
    reader.readAsText(blob);
  </script>
</body>
</html>
